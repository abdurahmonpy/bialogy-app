services:
  - type: web
    name: bialogy-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bialogy-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12

databases:
  - name: bialogy-postgres
    region: frankfurt
    plan: free
    databaseName: biology
    user: biology_user
