<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jonli Testga Ulanish | BioEdu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .pin-input {
      letter-spacing: 0.35em;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .pulse-glow {
      animation: pulse-slow 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-950 text-white min-h-screen flex flex-col justify-between p-4 selection:bg-purple-500 selection:text-white">

  <!-- Header -->
  <header class="max-w-md mx-auto w-full pt-6 flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
        <i data-lucide="dna" class="w-6 h-6"></i>
      </div>
      <div>
        <span class="font-extrabold text-lg text-white tracking-tight">BioEdu</span>
        <span class="block text-[10px] text-purple-200 font-semibold tracking-wider uppercase">Live Test</span>
      </div>
    </a>

    <div id="auth-status" class="text-xs">
      <!-- Injected by JS -->
    </div>
  </header>

  <!-- Main Box -->
  <main class="max-w-md mx-auto w-full py-8">
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
      <!-- Decorative background blur -->
      <div class="absolute -top-16 -right-16 w-36 h-36 bg-purple-500/30 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-emerald-500/20 rounded-full blur-2xl pointer-events-none"></div>

      <div class="text-center mb-6 relative z-10">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-900 shadow-lg shadow-orange-500/30 mb-3 pulse-glow">
          <i data-lucide="zap" class="w-7 h-7 fill-current"></i>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">Jonli Testga Ulanish</h1>
        <p class="text-xs text-purple-200 mt-1">O'qituvchingiz bergan 6 xonali PIN-kodni kiriting</p>
      </div>

      <form id="join-form" class="space-y-4 relative z-10">
        <!-- Error Alert -->
        <div id="error-alert" class="hidden p-3 bg-red-500/20 border border-red-400/40 rounded-xl text-red-200 text-xs flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
          <span id="error-text">Xatolik yuz berdi</span>
        </div>

        <!-- PIN Input -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-purple-200 mb-1.5 text-center">
            O'yin PIN-kodi
          </label>
          <input 
            type="text" 
            id="pin-code" 
            maxlength="6" 
            required 
            pattern="[0-9]{6}"
            placeholder="000000"
            autocomplete="off"
            class="pin-input w-full text-center text-3xl font-black tracking-widest px-4 py-3.5 bg-black/30 border-2 border-white/20 rounded-2xl text-white placeholder-white/25 focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-400/20 transition shadow-inner">
        </div>

        <!-- Guest Name Input (Only needed if not logged in) -->
        <div id="guest-name-field" class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-purple-200 mb-1">
            Ism va Familiyangiz
          </label>
          <div class="relative">
            <i data-lucide="user" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-purple-300"></i>
            <input 
              type="text" 
              id="student-name" 
              placeholder="Masalan: Azizbek Karimov"
              class="w-full pl-11 pr-4 py-3 bg-black/30 border border-white/20 rounded-2xl text-sm font-semibold text-white placeholder-white/30 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/30 transition">
          </div>
          <p class="text-[11px] text-purple-300">Parolsiz tezkor qatnashish uchun ismingizni kiriting</p>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="join-btn"
          class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-base rounded-2xl shadow-xl shadow-emerald-500/30 hover:shadow-emerald-500/50 hover:scale-[1.02] active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer">
          <span>O'yinga Kirish</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>

      <!-- Account Switcher / Hint -->
      <div class="mt-6 pt-5 border-t border-white/10 text-center">
        <div id="logged-in-hint" class="hidden text-xs text-purple-200">
          Tizimga kirilgan: <span id="current-user-name" class="font-bold text-white"></span>
          <div class="mt-2 flex items-center justify-center gap-4 text-xs font-semibold">
            <a href="/student/test.html" class="text-emerald-300 hover:text-emerald-200 underline">Kabinetga o'tish</a>
            <span class="text-white/30">•</span>
            <button onclick="logoutGuest()" class="text-purple-300 hover:text-white underline">Boshqa foydalanuvchi</button>
          </div>
        </div>

        <div id="logged-out-hint" class="text-xs text-purple-200">
          Akkauntingiz bormi? 
          <a href="/login.html" class="text-emerald-300 hover:text-emerald-200 font-bold underline ml-1">Kirish</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-md mx-auto w-full pb-4 text-center text-xs text-purple-300/70">
    BioEdu Jonli Test Tizimi • Kahoot-uslubidagi interaktiv sinov
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const form = document.getElementById("join-form");
      const pinInput = document.getElementById("pin-code");
      const nameInput = document.getElementById("student-name");
      const guestField = document.getElementById("guest-name-field");
      const errorAlert = document.getElementById("error-alert");
      const errorText = document.getElementById("error-text");
      const joinBtn = document.getElementById("join-btn");
      const loggedInHint = document.getElementById("logged-in-hint");
      const loggedOutHint = document.getElementById("logged-out-hint");
      const currentUserNameEl = document.getElementById("current-user-name");

      // Auto-fill PIN from URL query string if provided (?code=123456)
      const urlParams = new URLSearchParams(window.location.search);
      const codeFromUrl = urlParams.get("code") || urlParams.get("pin");
      if (codeFromUrl) {
        pinInput.value = codeFromUrl.replace(/\D/g, "").slice(0, 6);
      }

      // Check current user
      const currentUser = window.Auth ? window.Auth.getCurrentUser() : null;
      if (currentUser && currentUser.fullName) {
        guestField.classList.add("hidden");
        loggedInHint.classList.remove("hidden");
        loggedOutHint.classList.add("hidden");
        currentUserNameEl.textContent = currentUser.fullName;
      } else {
        guestField.classList.remove("hidden");
        loggedInHint.classList.add("hidden");
        loggedOutHint.classList.remove("hidden");
      }

      pinInput.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
      });

      function showError(msg) {
        errorText.textContent = msg;
        errorAlert.classList.remove("hidden");
        lucide.createIcons();
      }

      function hideError() {
        errorAlert.classList.add("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const code = pinInput.value.trim();
        if (code.length !== 6) {
          showError("Iltimos, 6 xonali PIN-kodni to'liq kiriting");
          pinInput.focus();
          return;
        }

        let studentName = "";
        let studentId = "";
        let isGuest = false;

        if (currentUser && currentUser.id) {
          studentId = currentUser.id;
          studentName = currentUser.fullName || "O'quvchi";
          isGuest = false;
        } else {
          studentName = nameInput.value.trim();
          if (!studentName) {
            showError("Iltimos, ism va familiyangizni kiriting");
            nameInput.focus();
            return;
          }
          isGuest = true;
          // Remember guest name in sessionStorage
          sessionStorage.setItem("live_guest_name", studentName);
        }

        joinBtn.disabled = true;
        joinBtn.innerHTML = `
          <div class="w-5 h-5 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
          <span>Ulanmoqda...</span>
        `;

        try {
          // Pre-validate session
          const res = await fetch(`/api/live-test/session/${code}`);
          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.detail || "PIN-kod noto'g'ri yoki test topilmadi");
          }

          if (data.status === "finished") {
            throw new Error("Ushbu test sessiyasi allaqachon yakunlangan");
          }

          // Redirect to student runner
          const targetUrl = `/student/live-test.html?code=${encodeURIComponent(code)}&guestName=${encodeURIComponent(studentName)}`;
          window.location.href = targetUrl;
        } catch (err) {
          showError(err.message || "Xatolik yuz berdi");
          joinBtn.disabled = false;
          joinBtn.innerHTML = `
            <span>O'yinga Kirish</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          `;
          lucide.createIcons();
        }
      });

      window.logoutGuest = function() {
        if (window.Auth) window.Auth.logout();
        window.location.reload();
      };
    });
  </script>
</body>
</html>
