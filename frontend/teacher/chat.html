<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | O'qituvchi Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Teacher Sidebar Container -->
    <div id="teacher-sidebar"></div>

    <!-- Main Content Area: Chat Window (Full bleed, edge-to-edge) -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-white w-full">
      
      <div class="flex-1 flex flex-col lg:flex-row h-full overflow-hidden w-full">
        
        <!-- Channels List -->
        <div class="w-full lg:w-80 border-b lg:border-b-0 lg:border-r border-slate-200 flex flex-col flex-shrink-0 bg-slate-50/40">
          <div class="p-3.5 border-b border-slate-200 flex items-center justify-between bg-white">
            <div class="flex items-center gap-2">
              <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                <i data-lucide="message-square" class="w-4 h-4 text-indigo-600"></i>
                Muloqotlar
              </h2>
            </div>
            <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 text-[11px] font-bold rounded-full">Ustoz Chat</span>
          </div>

          <div class="p-2 space-y-1.5 overflow-y-auto">
            <!-- Channel: Class Group -->
            <button onclick="selectTeacherChannel('group')" id="ch-group" class="w-full p-3 rounded-2xl flex items-center gap-3 bg-indigo-50 text-slate-800 transition text-left border border-indigo-100">
              <div class="w-11 h-11 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center flex-shrink-0 shadow-sm">
                <i data-lucide="users" class="w-5 h-5"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between mb-0.5">
                  <h4 class="text-xs font-bold text-slate-800 truncate">Biologiya guruhi</h4>
                  <span class="text-[10px] text-indigo-600 font-semibold">Umumiy</span>
                </div>
                <p class="text-[11px] text-slate-500 truncate">Barcha o'quvchilar bilan suhbat</p>
              </div>
            </button>

            <div class="pt-2 px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">O'quvchilar bilan muloqot</div>
            <div id="students-chat-list" class="space-y-1">
              <p class="text-[11px] text-slate-400 px-2 py-1">Yuklanmoqda...</p>
            </div>
          </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
          
          <div class="p-3.5 border-b border-slate-200 flex items-center justify-between bg-white flex-shrink-0">
            <div class="flex items-center gap-3">
              <div id="header-avatar" class="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-sm">
                <i data-lucide="users" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 id="header-title" class="text-sm font-bold text-slate-800">Biologiya guruhi</h3>
                <p id="header-desc" class="text-[11px] text-slate-400">Barcha o'quvchilar uchun umumiy guruh chati</p>
              </div>
            </div>
          </div>

          <div id="teacher-msg-container" class="flex-1 p-4 lg:p-6 overflow-y-auto space-y-4 chat-scroll bg-slate-50/50">
            <!-- Messages rendered dynamically -->
          </div>

          <div class="p-3 lg:p-4 bg-white border-t border-slate-100 flex-shrink-0">
            <form id="teacher-chat-form" class="flex items-center gap-2">
              <input type="text" id="teacher-msg-input" required placeholder="Xabarni yozing..."
                class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
              
              <button type="submit" class="p-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl shadow-md shadow-indigo-500/20 transition flex items-center justify-center flex-shrink-0">
                <i data-lucide="send" class="w-4 h-4"></i>
              </button>
            </form>
          </div>

        </div>

      </div>

    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/teacher-nav.js"></script>
  <script>
    const currentUser = Auth.requireAuth("teacher");
    renderTeacherSidebar("Chat");

    let activeChannel = "group"; // 'group', 'direct'
    let activeStudent = null;
    let studentList = [];
    const container = document.getElementById("teacher-msg-container");
    const input = document.getElementById("teacher-msg-input");

    function selectTeacherChannel(ch = "group") {
      activeChannel = ch;
      activeStudent = null;
      document.querySelectorAll("#students-chat-list button").forEach(b => b.classList.remove("bg-indigo-50", "border", "border-indigo-100"));
      
      const groupBtn = document.getElementById("ch-group");
      if (groupBtn) {
        groupBtn.className = "w-full p-3 rounded-2xl flex items-center gap-3 bg-indigo-50 text-slate-800 transition text-left border border-indigo-100";
      }

      const title = document.getElementById("header-title");
      const desc = document.getElementById("header-desc");
      const avatar = document.getElementById("header-avatar");

      title.textContent = "Biologiya guruhi";
      desc.textContent = "Barcha o'quvchilar uchun umumiy guruh chati";
      avatar.className = "w-10 h-10 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center shadow-sm";
      avatar.innerHTML = `<i data-lucide="users" class="w-5 h-5"></i>`;

      lucide.createIcons();
      loadTeacherMessages();
    }

    function selectStudentChat(studentId) {
      const student = studentList.find(s => s.id === studentId);
      if (!student) return;

      activeChannel = "direct";
      activeStudent = student;

      const groupBtn = document.getElementById("ch-group");
      if (groupBtn) {
        groupBtn.className = "w-full p-3 rounded-2xl flex items-center gap-3 hover:bg-slate-50 text-slate-800 transition text-left";
      }

      document.querySelectorAll("#students-chat-list button").forEach(b => {
        b.className = "w-full p-2.5 rounded-2xl flex items-center gap-3 hover:bg-slate-50 text-slate-800 transition text-left group";
      });
      const activeBtn = document.getElementById(`stud-btn-${studentId}`);
      if (activeBtn) {
        activeBtn.className = "w-full p-2.5 rounded-2xl flex items-center gap-3 bg-indigo-50 border border-indigo-100 text-slate-800 transition text-left group";
      }

      const title = document.getElementById("header-title");
      const desc = document.getElementById("header-desc");
      const avatar = document.getElementById("header-avatar");

      title.textContent = student.fullName;
      desc.textContent = `${student.classGrade || 'O\'quvchi'} • ${student.email || student.phone || 'Onlayn'}`;
      avatar.className = "w-10 h-10 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center";
      avatar.innerHTML = student.avatar || student.fullName?.[0] || 'O';

      lucide.createIcons();
      loadTeacherMessages();
    }

    async function loadStudentsList() {
      const listContainer = document.getElementById("students-chat-list");
      try {
        const res = await fetch("/api/students");
        studentList = await res.json();
        if (!studentList || studentList.length === 0) {
          listContainer.innerHTML = `<p class="text-[11px] text-slate-400 px-2 py-2 italic">Hozircha o'quvchilar yo'q. <a href="/teacher/add-student.html" class="text-indigo-600 font-bold hover:underline">Qo'shish &rarr;</a></p>`;
          return;
        }

        listContainer.innerHTML = studentList.map(s => `
          <button onclick="selectStudentChat('${s.id}')" id="stud-btn-${s.id}" class="w-full p-2.5 rounded-2xl flex items-center gap-3 hover:bg-slate-50 text-slate-800 transition text-left group">
            <div class="w-9 h-9 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0">
              ${s.avatar || s.fullName?.[0] || 'O'}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-slate-800 truncate">${s.fullName}</h4>
              <p class="text-[10px] text-slate-400 truncate">${s.classGrade || 'O\'quvchi'}</p>
            </div>
          </button>
        `).join("");

        // Check URL params for studentId
        const urlParams = new URLSearchParams(window.location.search);
        const reqStudentId = urlParams.get("studentId");
        if (reqStudentId) {
          selectStudentChat(reqStudentId);
        }
      } catch (e) {
        listContainer.innerHTML = `<p class="text-[11px] text-red-400 px-2">Yuklab bo'lmadi</p>`;
      }
    }

    async function loadTeacherMessages() {
      container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">Xabarlar yuklanmoqda...</div>`;

      try {
        let url = `/api/chat/messages?channel=${activeChannel}`;
        if (activeStudent) {
          url += `&userId=${activeStudent.id}`;
        }
        const res = await fetch(url);
        const messages = await res.json();

        if (!messages || messages.length === 0) {
          container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">Ushbu suhbatda hali xabarlar yo'q</div>`;
          return;
        }

        container.innerHTML = messages.map(m => {
          const isTeacher = m.senderRole === "teacher" || m.senderId === currentUser?.id;
          if (isTeacher) {
            return `
              <div class="flex justify-end gap-2.5">
                <div class="max-w-md bg-indigo-600 text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm text-xs leading-relaxed">
                  <div class="font-bold text-[10px] text-indigo-200 mb-0.5">Siz (Ustoz)</div>
                  <div>${m.text}</div>
                  <div class="text-[9px] text-indigo-300 text-right mt-1">${m.time || 'Hozir'}</div>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="flex justify-start gap-2.5">
                <div class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold text-xs flex items-center justify-center flex-shrink-0 mt-1">
                  ${m.senderName?.[0] || 'O'}
                </div>
                <div class="max-w-md bg-white border border-slate-200/80 p-3.5 rounded-2xl rounded-tl-none shadow-sm text-xs text-slate-700 leading-relaxed">
                  <div class="font-bold text-[11px] text-slate-800 mb-0.5">${m.senderName || 'O\'quvchi'}</div>
                  <div class="whitespace-pre-line">${m.text}</div>
                  <div class="text-[9px] text-slate-400 text-right mt-1">${m.time || 'Hozir'}</div>
                </div>
              </div>
            `;
          }
        }).join("");

        container.scrollTop = container.scrollHeight;
      } catch (e) {
        container.innerHTML = `<div class="text-center py-6 text-red-500 text-xs">Xatolik yuz berdi</div>`;
      }
    }

    document.getElementById("teacher-chat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const nowTime = new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });

      try {
        await fetch("/api/chat/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            channel: activeChannel,
            senderId: currentUser.id,
            senderName: currentUser.fullName || "O'qituvchi",
            text: text
          })
        });
        loadTeacherMessages();
      } catch (err) {
        console.error("Chat error:", err);
      }
    });

    loadStudentsList();
    selectTeacherChannel("group");
  </script>
</body>
</html>
