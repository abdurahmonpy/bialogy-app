<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guruhlarim | O'qituvchi Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Teacher Sidebar Container -->
    <div id="teacher-sidebar"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-semibold mb-1">
            <i data-lucide="users" class="w-3.5 h-3.5"></i>
            Sinf va guruhlar
          </div>
          <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Guruhlarim</h1>
          <p class="text-xs text-slate-500">Siz dars berayotgan sinflar va maxsus to'garaklar ro'yxati</p>
        </div>
        <button id="open-new-group-modal" class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Yangi guruh ochish
        </button>
      </div>

      <!-- Groups Grid -->
      <div id="groups-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="text-center py-12 text-slate-400 text-xs col-span-3">Guruhlar yuklanmoqda...</div>
      </div>

    </main>
  </div>

  <!-- Create Group Modal -->
  <div id="group-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="font-bold text-slate-800 text-base">Yangi guruh qo'shish</h3>
        <button id="close-modal-btn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="create-group-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Guruh / Sinf nomi</label>
          <input type="text" id="group-name" required placeholder="Masalan: 10-A Biologiya chuqurlashtirilgan"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Fan</label>
          <input type="text" id="group-subject" value="Biologiya" required
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Dars jadvali / Vaqti</label>
          <input type="text" id="group-schedule" placeholder="Dush-Chor-Juma 09:00"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition shadow-md shadow-indigo-500/20">
          Guruhni saqlash
        </button>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/teacher-nav.js"></script>
  <script>
    const currentUser = Auth.requireAuth("teacher");
    renderTeacherSidebar("Guruhlarim");

    const groupsList = document.getElementById("groups-list");
    const groupModal = document.getElementById("group-modal");
    const openBtn = document.getElementById("open-new-group-modal");
    const closeBtn = document.getElementById("close-modal-btn");
    const form = document.getElementById("create-group-form");

    openBtn.addEventListener("click", () => groupModal.classList.remove("hidden"));
    closeBtn.addEventListener("click", () => groupModal.classList.add("hidden"));

    async function loadGroups() {
      try {
        const res = await fetch("/api/groups");
        const groups = await res.json();

        if (!groups || groups.length === 0) {
          groupsList.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs col-span-3">Hozircha guruhlar mavjud emas</div>`;
          return;
        }

        groupsList.innerHTML = groups.map(g => `
          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="px-3 py-1 bg-indigo-50 text-indigo-700 text-[11px] font-bold rounded-full">${g.subject || 'Biologiya'}</span>
                <span class="text-xs font-semibold text-slate-400">${g.studentCount || 0} o'quvchi</span>
              </div>
              <h3 class="text-lg font-bold text-slate-800 mb-1">${g.name}</h3>
              <p class="text-xs text-slate-400 flex items-center gap-1.5 mb-4">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                ${g.schedule || 'Har kuni'}
              </p>
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
              <a href="/teacher/students.html?groupId=${g.id}" class="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-1">
                O'quvchilar ro'yxati <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </a>
              <button onclick="deleteGroup('${g.id}')" title="Guruhni o'chirish" class="p-2 text-slate-300 hover:text-red-500 rounded-lg transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `).join("");

        lucide.createIcons();
      } catch (e) {
        groupsList.innerHTML = `<div class="text-center py-12 text-red-500 text-xs col-span-3">Xatolik yuz berdi</div>`;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("group-name").value.trim();
      const subject = document.getElementById("group-subject").value.trim();
      const schedule = document.getElementById("group-schedule").value.trim();

      try {
        const res = await fetch("/api/groups", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, subject, schedule })
        });
        if (!res.ok) throw new Error("Guruh yaratilmadi");

        groupModal.classList.add("hidden");
        form.reset();
        loadGroups();
      } catch (err) {
        alert("Xatolik: " + err.message);
      }
    });

    window.deleteGroup = async function(id) {
      if (!confirm("Rostdan ham ushbu guruhni o'chirmoqchimisiz?")) return;
      try {
        await fetch(`/api/groups/${id}`, { method: "DELETE" });
        loadGroups();
      } catch (e) {
        alert("O'chirishda xatolik");
      }
    };

    loadGroups();
  </script>
</body>
</html>
