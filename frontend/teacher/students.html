<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'quvchilar | O'qituvchi Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Teacher Sidebar Container -->
    <div id="teacher-sidebar"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-semibold mb-1">
            <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
            O'quvchilar Ro'yxati
          </div>
          <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">O'quvchilar</h1>
          <p class="text-xs text-slate-500">Barcha sinf va guruhlardagi o'quvchilarni nazorat qiling</p>
        </div>
        <a href="/teacher/add-student.html" class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          Yangi o'quvchi qo'shish
        </a>
      </div>

      <!-- Filter and Search Bar -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row items-center gap-3 mb-6">
        <div class="relative flex-1 w-full">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" placeholder="O'quvchi ismi yoki familiyasi bo'yicha qidirish..."
            class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
        <select id="group-filter" class="w-full md:w-56 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          <option value="all">Barcha sinflar</option>
        </select>
      </div>

      <!-- Students Table -->
      <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 border-b border-slate-100 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
              <tr>
                <th class="py-4 px-6">O'quvchi</th>
                <th class="py-4 px-4">Sinf / Guruh</th>
                <th class="py-4 px-4">Email</th>
                <th class="py-4 px-4">Telefon</th>
                <th class="py-4 px-4 text-center">Faollik</th>
                <th class="py-4 px-6 text-right">Amallar</th>
              </tr>
            </thead>
            <tbody id="students-tbody" class="divide-y divide-slate-100">
              <tr><td colspan="6" class="py-10 text-center text-slate-400">Yuklanmoqda...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/teacher-nav.js"></script>
  <script>
    const currentUser = Auth.requireAuth("teacher");
    renderTeacherSidebar("O'quvchilar");

    let allStudents = [];
    const tbody = document.getElementById("students-tbody");
    const searchInput = document.getElementById("search-input");
    const groupFilter = document.getElementById("group-filter");

    async function loadStudents() {
      try {
        const [res, grpRes] = await Promise.all([
          fetch("/api/students"),
          fetch("/api/groups")
        ]);
        allStudents = await res.json();
        const groups = await grpRes.json();
        if (groups && groups.length > 0) {
          groupFilter.innerHTML = `<option value="all">Barcha sinflar</option>` + groups.map(g => `<option value="${g.name}">${g.name}</option>`).join("");
        }
        renderFilteredStudents();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-red-500">Xatolik yuz berdi</td></tr>`;
      }
    }

    function renderFilteredStudents() {
      const q = searchInput.value.toLowerCase().trim();
      const filterGroup = groupFilter.value;

      const filtered = allStudents.filter(s => {
        const matchName = (s.fullName || "").toLowerCase().includes(q) || (s.login || "").toLowerCase().includes(q);
        const matchGroup = filterGroup === "all" || (s.classGrade || "").includes(filterGroup);
        return matchName && matchGroup;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-400">Hech qanday o'quvchi topilmadi</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(s => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="py-3.5 px-6">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center flex-shrink-0 text-xs">
                ${s.avatar || s.fullName?.[0] || 'O'}
              </div>
              <div>
                <p class="font-bold text-slate-800">${s.fullName}</p>
                <p class="text-[10px] text-slate-400">@${s.login}</p>
              </div>
            </div>
          </td>
          <td class="py-3.5 px-4 font-semibold text-slate-700">${s.classGrade || 'Belgilanmagan'}</td>
          <td class="py-3.5 px-4 text-slate-500 truncate max-w-[180px]">${s.email || 'Kiritilmagan'}</td>
          <td class="py-3.5 px-4 text-slate-500">${s.phone || 'Mavjud emas'}</td>
          <td class="py-3.5 px-4 text-center">
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700">
              <i data-lucide="flame" class="w-3 h-3 text-amber-500"></i>
              ${s.streakDays || 1} kun
            </span>
          </td>
          <td class="py-3.5 px-6 text-right">
            <div class="flex items-center justify-end gap-2">
              <a href="/teacher/chat.html?studentId=${s.id}" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Xabar yozish">
                <i data-lucide="message-circle" class="w-4 h-4"></i>
              </a>
              <button onclick="removeStudent('${s.id}')" class="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition" title="O'chirish">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join("");

      lucide.createIcons();
    }

    searchInput.addEventListener("input", renderFilteredStudents);
    groupFilter.addEventListener("change", renderFilteredStudents);

    window.removeStudent = async function(id) {
      if (!confirm("O'quvchini tizimdan o'chirmoqchimisiz?")) return;
      try {
        await fetch(`/api/students/${id}`, { method: "DELETE" });
        loadStudents();
      } catch (e) {
        alert("O'chirishda xatolik");
      }
    };

    loadStudents();
  </script>
</body>
</html>
