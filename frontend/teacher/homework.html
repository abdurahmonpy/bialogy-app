<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uyga vazifalar | O'qituvchi Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Teacher Sidebar Container -->
    <div id="teacher-sidebar"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-semibold mb-1">
            <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i>
            Topshiriqlar Nazorati
          </div>
          <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Uyga vazifalar</h1>
          <p class="text-xs text-slate-500">O'quvchilarga vazifa tayinlash va kelib tushgan javoblarni tekshirib baholash</p>
        </div>
        <button id="open-hw-modal" class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Yangi vazifa berish
        </button>
      </div>

      <!-- Homework List -->
      <div id="teacher-hw-list" class="space-y-6">
        <div class="text-center py-12 text-slate-400 text-xs">Yuklanmoqda...</div>
      </div>

    </main>
  </div>

  <!-- Create Homework Modal -->
  <div id="create-hw-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="font-bold text-slate-800 text-base">Yangi uyga vazifa yaratish</h3>
        <button id="close-hw-btn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="create-hw-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Vazifa mavzusi</label>
          <input type="text" id="hw-title" required placeholder="Masalan: Fotosintez fazalarini solishtirish jadvali"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Guruh / Sinf</label>
            <select id="hw-group-select" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              <option value="8-A sinf">8-A sinf</option>
              <option value="9-B sinf">9-B sinf</option>
              <option value="Abituriyentlar">Abituriyentlar guruhi</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Topshirish muddati</label>
            <input type="date" id="hw-deadline" required
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Topshiriq matni va ko'rsatmalar</label>
          <textarea id="hw-desc" rows="4" required placeholder="O'quvchilar nima qilishi kerakligini batafsil yozing..."
            class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition shadow-md shadow-indigo-500/20">
          Vazifani e'lon qilish
        </button>
      </form>
    </div>
  </div>

  <!-- Grade Submission Modal -->
  <div id="grade-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="font-bold text-slate-800 text-base">O'quvchi javobini baholash</h3>
        <button id="close-grade-btn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="grade-form" class="space-y-4">
        <input type="hidden" id="grade-hw-id">
        <input type="hidden" id="grade-student-id">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Baho</label>
          <select id="grade-val" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <option value="5 (A'lo)">5 (A'lo)</option>
            <option value="4 (Yaxshi)">4 (Yaxshi)</option>
            <option value="3 (Qoniqarli)">3 (Qoniqarli)</option>
            <option value="2 (Qayta topshirish)">2 (Qayta topshirish)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Ustoz taqrizi va izohi</label>
          <textarea id="grade-feedback" rows="3" placeholder="O'quvchiga yo'l-yo'riq yoki kamchiliklar haqida fikr..."
            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-md shadow-emerald-500/20">
          Bahoni saqlash va yuborish
        </button>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/teacher-nav.js"></script>
  <script>
    const currentUser = Auth.requireAuth("teacher");
    renderTeacherSidebar("Uyga vazifa");

    const hwList = document.getElementById("teacher-hw-list");
    const createModal = document.getElementById("create-hw-modal");
    const gradeModal = document.getElementById("grade-modal");
    const openHwBtn = document.getElementById("open-hw-modal");
    const closeHwBtn = document.getElementById("close-hw-btn");
    const closeGradeBtn = document.getElementById("close-grade-btn");

    openHwBtn.addEventListener("click", () => createModal.classList.remove("hidden"));
    closeHwBtn.addEventListener("click", () => createModal.classList.add("hidden"));
    closeGradeBtn.addEventListener("click", () => gradeModal.classList.add("hidden"));

    async function loadTeacherHomework() {
      try {
        const res = await fetch("/api/homework");
        const list = await res.json();

        if (!list || list.length === 0) {
          hwList.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">Hozircha biriktirilgan vazifalar yo'q.</div>`;
          return;
        }

        hwList.innerHTML = list.map(hw => {
          const subs = hw.submissions || [];

          return `
            <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-4 border-b border-slate-100">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 text-[10px] font-bold rounded-full">${hw.groupName || 'Barcha guruhlar'}</span>
                    <span class="text-xs text-slate-400">&bull; Muddati: ${hw.deadline || 'Belgilanmagan'}</span>
                  </div>
                  <h3 class="text-base font-bold text-slate-800">${hw.title}</h3>
                </div>
                <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                  ${subs.length} ta topshirildi
                </span>
              </div>

              <p class="text-xs text-slate-600 mb-5 leading-relaxed bg-slate-50 p-3.5 rounded-2xl">${hw.description}</p>

              <!-- Submissions section -->
              <div>
                <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">Topshirgan o'quvchilar javoblari:</h4>
                
                ${subs.length === 0 ? `
                  <p class="text-xs text-slate-400 italic">Hali hech kim topshirmadi.</p>
                ` : `
                  <div class="space-y-3">
                    ${subs.map(s => `
                      <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-xs text-slate-800">${s.studentName || 'O\'quvchi'}</span>
                            <span class="text-[10px] text-slate-400">&bull; ${s.submittedAt || 'Bugun'}</span>
                          </div>
                          <p class="text-xs text-slate-600">${s.text}</p>
                          ${s.feedback ? `<p class="text-[11px] text-emerald-700 mt-1">Izohingiz: "${s.feedback}"</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                          ${s.grade ? `
                            <span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">
                              Baho: ${s.grade}
                            </span>
                          ` : `
                            <button onclick="openGradeModal('${hw.id}', '${s.studentId}')" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                              Baholash
                            </button>
                          `}
                        </div>
                      </div>
                    `).join("")}
                  </div>
                `}
              </div>
            </div>
          `;
        }).join("");

        lucide.createIcons();
      } catch (e) {
        hwList.innerHTML = `<div class="text-center py-12 text-red-500 text-xs">Xatolik yuz berdi</div>`;
      }
    }

    document.getElementById("create-hw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("hw-title").value.trim();
      const groupName = document.getElementById("hw-group-select").value;
      const deadline = document.getElementById("hw-deadline").value;
      const description = document.getElementById("hw-desc").value.trim();

      try {
        const res = await fetch("/api/homework", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            groupName,
            deadline,
            description,
            teacherName: currentUser.fullName
          })
        });

        if (!res.ok) throw new Error("Vazifa saqlanmadi");
        createModal.classList.add("hidden");
        document.getElementById("create-hw-form").reset();
        loadTeacherHomework();
      } catch (err) {
        alert("Xatolik: " + err.message);
      }
    });

    window.openGradeModal = function(hwId, studentId) {
      document.getElementById("grade-hw-id").value = hwId;
      document.getElementById("grade-student-id").value = studentId;
      document.getElementById("grade-feedback").value = "";
      gradeModal.classList.remove("hidden");
    };

    document.getElementById("grade-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const hwId = document.getElementById("grade-hw-id").value;
      const studentId = document.getElementById("grade-student-id").value;
      const grade = document.getElementById("grade-val").value;
      const feedback = document.getElementById("grade-feedback").value.trim();

      try {
        const res = await fetch(`/api/homework/${hwId}/grade`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ studentId, grade, feedback })
        });
        if (!res.ok) throw new Error("Baholashda xatolik");

        gradeModal.classList.add("hidden");
        loadTeacherHomework();
      } catch (err) {
        alert("Xatolik: " + err.message);
      }
    });

    loadTeacherHomework();
  </script>
</body>
</html>
