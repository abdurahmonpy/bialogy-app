<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Yordamchi | O'qituvchi Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="flex flex-col lg:flex-row h-screen overflow-hidden">
    <!-- Teacher Sidebar Container -->
    <div id="teacher-sidebar"></div>

    <!-- Main Content Area: Edge-to-Edge Clean Full-Height Chat -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 w-full relative">
      
      <!-- Messages Stream Area -->
      <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scroll">
        <div id="messages-inner-list" class="max-w-3xl mx-auto w-full space-y-4">
          
          <!-- Initial AI Welcome Greeting -->
          <div class="flex items-start gap-3 max-w-2xl">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center flex-shrink-0 text-xs font-bold shadow-md shadow-purple-500/20">
              <i data-lucide="bot" class="w-5 h-5"></i>
            </div>
            <div class="bg-white p-4.5 rounded-3xl rounded-tl-sm border border-slate-200/80 shadow-sm text-xs sm:text-sm text-slate-700 leading-relaxed">
              <p class="font-bold text-slate-900 mb-1">Assalomu alaykum, ustoz!</p>
              Men biologiya va kimyo fanlari bo'yicha shaxsiy AI yordamchingizman. Darsni qiziqarli o'tish, qiyin mavzularni tushuntirish metodlari, yangi pedagogik o'yinlar yoki savol-javoblar bo'yicha istalgan savolingizni bering!
            </div>
          </div>

        </div>
      </div>

      <!-- Bottom Chat Bar Area -->
      <div class="w-full bg-slate-50 border-t border-slate-200/80 p-3 lg:p-4 flex-shrink-0">
        <div class="max-w-3xl mx-auto w-full space-y-2">
          
          <!-- Quick Suggestion Chips -->
          <div class="flex items-center gap-2 overflow-x-auto custom-scroll pb-1">
            <span class="text-[10px] uppercase font-bold text-slate-400 flex-shrink-0">Tavsiya:</span>
            <button type="button" onclick="sendQuickPrompt('Fotosintez mavzusini 8-sinf o\'quvchilariga sodda va qiziqarli tushuntirish usuli')"
              class="px-3 py-1.5 bg-white hover:bg-purple-50 text-purple-700 border border-slate-200 hover:border-purple-200 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer shadow-xs">
              💡 Fotosintezni sodda tushuntirish
            </button>
            <button type="button" onclick="sendQuickPrompt('Darsda o\'quvchilar e\'tiborini jalb qilish uchun 3 ta interaktiv metod tavsiya qiling')"
              class="px-3 py-1.5 bg-white hover:bg-indigo-50 text-indigo-700 border border-slate-200 hover:border-indigo-200 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer shadow-xs">
              ⚡ 3 ta interaktiv dars metodi
            </button>
            <button type="button" onclick="sendQuickPrompt('Genetika bo\'yicha Mendel qonunlariga oid qiziqarli masalalar tuzib bering')"
              class="px-3 py-1.5 bg-white hover:bg-emerald-50 text-emerald-700 border border-slate-200 hover:border-emerald-200 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer shadow-xs">
              🧬 Qiziqarli genetika masalalari
            </button>
          </div>

          <!-- Input Bar -->
          <form id="ai-chat-form" class="flex items-center gap-2 bg-white border border-slate-200 rounded-2xl p-1.5 shadow-sm focus-within:ring-2 focus-within:ring-purple-500 focus-within:border-transparent transition">
            <input type="text" id="ai-chat-input" required placeholder="Ustoz, savolingiz yoki pedagogik vazifani yozing..."
              class="flex-1 px-4 py-3 bg-transparent border-0 text-xs sm:text-sm focus:outline-none text-slate-800 placeholder-slate-400">
            
            <button type="submit" id="ai-chat-send-btn" class="p-3 bg-gradient-to-tr from-purple-600 to-indigo-600 hover:opacity-95 text-white rounded-xl shadow-md shadow-purple-500/20 transition flex items-center justify-center flex-shrink-0 cursor-pointer">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>

        </div>
      </div>

    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/teacher-nav.js"></script>
  <script>
    const currentUser = Auth.requireAuth("teacher");
    renderTeacherSidebar("AI Yordamchi");

    const scrollContainer = document.getElementById("ai-chat-messages");
    const messagesInnerList = document.getElementById("messages-inner-list");
    const chatForm = document.getElementById("ai-chat-form");
    const chatInput = document.getElementById("ai-chat-input");
    const chatSendBtn = document.getElementById("ai-chat-send-btn");

    window.sendQuickPrompt = function(promptText) {
      chatInput.value = promptText;
      chatForm.dispatchEvent(new Event("submit"));
    };

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      // Append Teacher Message
      const userHtml = `
        <div class="flex items-start justify-end gap-3 ml-auto max-w-2xl">
          <div class="bg-gradient-to-tr from-purple-600 to-indigo-600 text-white p-4 rounded-3xl rounded-tr-sm shadow-sm text-xs sm:text-sm leading-relaxed">
            ${escapeHtml(message)}
          </div>
          <div class="w-9 h-9 rounded-2xl bg-indigo-700 text-white flex items-center justify-center flex-shrink-0 text-xs font-bold shadow-sm">
            ${currentUser?.fullName?.[0] || 'U'}
          </div>
        </div>
      `;
      messagesInnerList.insertAdjacentHTML("beforeend", userHtml);
      chatInput.value = "";
      scrollContainer.scrollTop = scrollContainer.scrollHeight;

      // Loading Indicator
      const loadingId = "loading-" + Date.now();
      const loadingHtml = `
        <div id="${loadingId}" class="flex items-start gap-3 max-w-2xl">
          <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center flex-shrink-0 text-xs font-bold shadow-md shadow-purple-500/20">
            <i data-lucide="bot" class="w-5 h-5"></i>
          </div>
          <div class="bg-white p-4 rounded-3xl rounded-tl-sm border border-slate-200/80 text-xs sm:text-sm text-slate-400 italic flex items-center gap-2 shadow-sm">
            <span class="inline-block w-2 h-2 rounded-full bg-purple-600 animate-ping"></span>
            AI javob tayyorlamoqda...
          </div>
        </div>
      `;
      messagesInnerList.insertAdjacentHTML("beforeend", loadingHtml);
      if (window.lucide) lucide.createIcons();
      scrollContainer.scrollTop = scrollContainer.scrollHeight;

      try {
        const res = await fetch("/api/teacher/ai-assistant", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-User-Role": "teacher",
            "X-User-Id": currentUser?.id || "user-teacher-1"
          },
          body: JSON.stringify({ type: "chat", message: message })
        });

        const data = await res.json();
        
        const loader = document.getElementById(loadingId);
        if (loader) loader.remove();

        const aiReply = data.result || data.reply || "Javob olinmadi.";
        const aiHtml = `
          <div class="flex items-start gap-3 max-w-2xl">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center flex-shrink-0 text-xs font-bold shadow-md shadow-purple-500/20">
              <i data-lucide="bot" class="w-5 h-5"></i>
            </div>
            <div class="bg-white p-4.5 rounded-3xl rounded-tl-sm border border-slate-200/80 shadow-sm text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-wrap">
              ${escapeHtml(aiReply)}
            </div>
          </div>
        `;
        messagesInnerList.insertAdjacentHTML("beforeend", aiHtml);
        if (window.lucide) lucide.createIcons();
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
      } catch (err) {
        const loader = document.getElementById(loadingId);
        if (loader) loader.remove();

        messagesInnerList.insertAdjacentHTML("beforeend", `
          <div class="text-xs text-red-500 p-3 bg-red-50 rounded-xl border border-red-200">
            Xatolik: ${err.message}
          </div>
        `);
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
      }
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
