<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Yordamchi | O'qituvchi Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Teacher Sidebar Container -->
    <div id="teacher-sidebar"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 bg-purple-50 text-purple-700 rounded-full text-xs font-semibold mb-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            Sun'iy Intellekt Metodisti
          </div>
          <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">AI Yordamchi</h1>
          <p class="text-xs text-slate-500">Dars konspektlari, qiziqarli tajribalar va DTM testlarini bir zumda tuzing</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Generator Form -->
        <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm h-fit">
          <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i data-lucide="sliders" class="w-4 h-4 text-purple-600"></i>
            Parametrlarni tanlang
          </h2>

          <form id="ai-assistant-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Vazifa turi</label>
              <select id="task-type" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
                <option value="lesson_plan" selected>45 daqiqalik Dars Konspekti</option>
                <option value="experiment">Laboratoriya va Qiziqarli Tajribalar</option>
                <option value="test_questions">DTM va Olimpiada Murakkab Savollari</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Mavzu</label>
              <input type="text" id="task-topic" required value="Fotosintez va xloroplastlar faoliyati" placeholder="Masalan: Mitoz va meyoz bo'linishi"
                class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Sinf</label>
                <select id="task-grade" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
                  <option value="6-sinf">6-sinf</option>
                  <option value="7-sinf">7-sinf</option>
                  <option value="8-sinf" selected>8-sinf</option>
                  <option value="9-sinf">9-sinf</option>
                  <option value="10-sinf">10-sinf</option>
                  <option value="11-sinf">11-sinf</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Fan</label>
                <input type="text" id="task-subject" value="Biologiya" required
                  class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
              </div>
            </div>

            <button type="submit" id="generate-ai-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 text-white font-bold rounded-xl text-xs transition shadow-md shadow-purple-500/20 flex items-center justify-center gap-2">
              <i data-lucide="sparkles" class="w-4 h-4"></i>
              <span>Generatsiya qilish</span>
            </button>
          </form>
        </div>

        <!-- Right Column: Result Viewer -->
        <div class="lg:col-span-2">
          <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 lg:p-8 flex flex-col h-full min-h-[500px]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
              <div class="flex items-center gap-2">
                <span class="p-2 bg-purple-50 text-purple-600 rounded-xl">
                  <i data-lucide="file-text" class="w-4 h-4"></i>
                </span>
                <h3 class="text-sm font-bold text-slate-800">Tayyorlangan Material</h3>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="copyGeneratedText()" id="copy-btn" class="px-3 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl border border-slate-200 transition flex items-center gap-1.5">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i> Nusxa olish
                </button>
                <button onclick="window.print()" class="px-3 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl border border-slate-200 transition flex items-center gap-1.5">
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i> Chop etish
                </button>
              </div>
            </div>

            <!-- Content Area -->
            <div id="ai-output-box" class="flex-1 p-4 bg-slate-50 rounded-2xl border border-slate-100 text-xs text-slate-700 leading-relaxed overflow-y-auto whitespace-pre-wrap font-sans">
              Parametrlarni tanlang va "Generatsiya qilish" tugmasini bosing. AI siz uchun darslikka to'liq mos pedagogik material tayyorlab beradi.
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/teacher-nav.js"></script>
  <script>
    const currentUser = Auth.requireAuth("teacher");
    renderTeacherSidebar("AI Yordamchi");

    const form = document.getElementById("ai-assistant-form");
    const outputBox = document.getElementById("ai-output-box");
    const genBtn = document.getElementById("generate-ai-btn");
    const copyBtn = document.getElementById("copy-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = document.getElementById("task-type").value;
      const topic = document.getElementById("task-topic").value.trim();
      const grade = document.getElementById("task-grade").value;
      const subject = document.getElementById("task-subject").value.trim();

      genBtn.disabled = true;
      genBtn.innerHTML = `<span>Yaratilmoqda...</span>`;
      outputBox.textContent = "AI materialni tuzmoqda, biroz kuting...";

      try {
        const res = await fetch("/api/teacher/ai-assistant", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type, topic, grade, subject })
        });
        const data = await res.json();
        outputBox.textContent = data.result || "Natija shakllanmadi.";
      } catch (err) {
        outputBox.textContent = "Xatolik: " + err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i> <span>Generatsiya qilish</span>`;
        lucide.createIcons();
      }
    });

    window.copyGeneratedText = function() {
      const text = outputBox.textContent;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i> Nusxa olindi!`;
        lucide.createIcons();
        setTimeout(() => {
          copyBtn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i> Nusxa olish`;
          lucide.createIcons();
        }, 2000);
      });
    };
  </script>
</body>
</html>
