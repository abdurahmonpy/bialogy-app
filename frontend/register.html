<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ro'yxatdan o'tish | BioEdu Platformasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100 to-emerald-50 min-h-screen flex items-center justify-center p-4 py-8">

  <div class="w-full max-w-lg">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-lg shadow-emerald-500/25 mb-2">
        <i data-lucide="dna" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800">Yangi hisob yaratish</h1>
      <p class="text-slate-500 text-xs">BioEdu platformasiga qo'shiling va biologiyani zamonaviy o'rganing</p>
    </div>

    <!-- Register Card -->
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 border border-white/60 shadow-xl shadow-slate-200/50">
      
      <!-- Role Toggle -->
      <div class="flex p-1 bg-slate-100 rounded-2xl mb-6">
        <button id="role-student-btn" type="button" class="flex-1 py-2.5 rounded-xl font-bold text-sm text-emerald-700 bg-white shadow-sm transition-all flex items-center justify-center gap-2">
          <i data-lucide="graduation-cap" class="w-4 h-4"></i>
          O'quvchi
        </button>
        <button id="role-teacher-btn" type="button" class="flex-1 py-2.5 rounded-xl font-semibold text-sm text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-2">
          <i data-lucide="award" class="w-4 h-4"></i>
          O'qituvchi
        </button>
      </div>

      <!-- Error Alert -->
      <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span id="error-message"></span>
      </div>

      <!-- Form -->
      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">F.I.SH (To'liq ism-familiya)</label>
          <input type="text" id="fullName" required placeholder="Masalan: Sardor Komilov"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Login (Foydalanuvchi nomi)</label>
            <input type="text" id="username" required placeholder="Masalan: sardor99"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Parol</label>
            <input type="password" id="password" required placeholder="Kamida 3 ta belgi"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          </div>
        </div>

        <!-- Student Dynamic Field -->
        <div id="student-fields" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Sinfingiz</label>
            <select id="classGrade" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
              <option value="5-A sinf">5-sinf (Botanika)</option>
              <option value="6-A sinf">6-sinf (Botanika)</option>
              <option value="7-A sinf">7-sinf (Zoologiya)</option>
              <option value="8-A sinf" selected>8-sinf (Odam va uning salomatligi)</option>
              <option value="9-B sinf">9-sinf (Sitologiya va genetika)</option>
              <option value="10-A sinf">10-sinf (Umumiy biologiya)</option>
              <option value="11-A sinf">11-sinf (Evolutsiya va ekologiya)</option>
              <option value="Abituriyent">Abituriyent DTM tayyorlov</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Telefon raqam</label>
            <input type="tel" id="phone" placeholder="+998 90 123 45 67"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          </div>
        </div>

        <!-- Teacher Dynamic Field -->
        <div id="teacher-fields" class="hidden">
          <label class="block text-xs font-bold text-slate-700 mb-1">O'qitadigan faningiz</label>
          <input type="text" id="subject" value="Biologiya va Tabiiy fanlar" placeholder="Masalan: Biologiya"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Maktab yoki O'quv markazi</label>
          <input type="text" id="school" placeholder="Masalan: 14-sonli maktab"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition-all text-sm flex items-center justify-center gap-2 mt-2">
          <span>Ro'yxatdan o'tish</span>
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-5 text-center text-xs text-slate-500">
        Oldin ro'yxatdan o'tganmisiz? 
        <a href="/login.html" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline">Kirish sahifasi</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();

    let currentRole = "student";
    const roleStudentBtn = document.getElementById("role-student-btn");
    const roleTeacherBtn = document.getElementById("role-teacher-btn");
    const studentFields = document.getElementById("student-fields");
    const teacherFields = document.getElementById("teacher-fields");
    const submitBtn = document.getElementById("submit-btn");
    const errorBox = document.getElementById("error-box");
    const errorMessage = document.getElementById("error-message");

    function selectRole(role) {
      currentRole = role;
      if (role === "student") {
        roleStudentBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-emerald-700 bg-white shadow-sm transition-all flex items-center justify-center gap-2";
        roleTeacherBtn.className = "flex-1 py-2.5 rounded-xl font-semibold text-sm text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-2";
        studentFields.classList.remove("hidden");
        teacherFields.classList.add("hidden");
        submitBtn.className = "w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition-all text-sm flex items-center justify-center gap-2 mt-2";
      } else {
        roleTeacherBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-indigo-700 bg-white shadow-sm transition-all flex items-center justify-center gap-2";
        roleStudentBtn.className = "flex-1 py-2.5 rounded-xl font-semibold text-sm text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-2";
        studentFields.classList.add("hidden");
        teacherFields.classList.remove("hidden");
        submitBtn.className = "w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition-all text-sm flex items-center justify-center gap-2 mt-2";
      }
      lucide.createIcons();
    }

    roleStudentBtn.addEventListener("click", () => selectRole("student"));
    roleTeacherBtn.addEventListener("click", () => selectRole("teacher"));

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      const payload = {
        role: currentRole,
        fullName: document.getElementById("fullName").value.trim(),
        login: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value.trim(),
        school: document.getElementById("school").value.trim(),
        phone: document.getElementById("phone") ? document.getElementById("phone").value.trim() : "",
        classGrade: currentRole === "student" ? document.getElementById("classGrade").value : "",
        subject: currentRole === "teacher" ? document.getElementById("subject").value : ""
      };

      try {
        const user = await Auth.register(payload);
        if (user.role === "teacher") {
          window.location.href = "/teacher/";
        } else {
          window.location.href = "/student/";
        }
      } catch (err) {
        errorBox.classList.remove("hidden");
        errorMessage.textContent = err.message || "Ro'yxatdan o'tishda xatolik yuz berdi";
      }
    });
  </script>
</body>
</html>
