<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'quvchi Ro'yxatdan O'tish | BioEdu Platformasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100 to-emerald-50 min-h-screen flex items-center justify-center p-4 py-8">

  <div class="w-full max-w-lg">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-lg shadow-emerald-500/25 mb-3">
        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
      </div>
      <div class="inline-block px-3 py-1 bg-emerald-50 border border-emerald-200/60 rounded-full text-[11px] font-bold text-emerald-700 mb-2">
        Faqat O'quvchilar Uchun
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800">O'quvchi hisobini yaratish</h1>
      <p class="text-slate-500 text-xs mt-1">BioEdu platformasiga qo'shiling va biologiyani qiziqarli o'rganing</p>
    </div>

    <!-- Register Card -->
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-6 sm:p-8 border border-white/60 shadow-xl shadow-slate-200/50">
      
      <!-- Error Alert -->
      <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span id="error-message"></span>
      </div>

      <!-- Form -->
      <form id="register-form" class="space-y-4">
        <!-- 1. Full name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            F.I.SH (To'liq ism-familiyangiz) <span class="text-red-500">*</span>
          </label>
          <input type="text" id="fullName" required placeholder="Masalan: Sardor Komilov"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
        </div>

        <!-- 2. Email -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            Elektron pochta (Email) <span class="text-red-500">*</span>
          </label>
          <input type="email" id="email" required placeholder="Masalan: sardor@gmail.com"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
        </div>

        <!-- 3. Login & Password -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Login (Foydalanuvchi nomi) <span class="text-red-500">*</span>
            </label>
            <input type="text" id="username" required placeholder="Masalan: sardor99"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Parol <span class="text-red-500">*</span>
            </label>
            <input type="password" id="password" required placeholder="Kamida 3 ta belgi"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          </div>
        </div>

        <!-- 4. Class Grade & Phone -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Sinfingiz <span class="text-red-500">*</span>
            </label>
            <select id="classGrade" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
              <option value="" disabled>Sinfni tanlang...</option>
              <option value="5-sinf">5-sinf (Botanika)</option>
              <option value="6-sinf">6-sinf (Botanika)</option>
              <option value="7-sinf">7-sinf (Zoologiya)</option>
              <option value="8-A sinf" selected>8-sinf (Odam anatomiyasi)</option>
              <option value="9-sinf">9-sinf (Sitologiya va genetika)</option>
              <option value="10-sinf">10-sinf (Umumiy biologiya)</option>
              <option value="11-sinf">11-sinf (Ekologiya va evolutsiya)</option>
              <option value="Abituriyent">Abituriyent DTM tayyorlov</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Telefon raqamingiz <span class="text-red-500">*</span>
            </label>
            <input type="tel" id="phone" required placeholder="+998 90 123 45 67"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition-all text-sm flex items-center justify-center gap-2 mt-4">
          <span>O'quvchi sifatida ro'yxatdan o'tish</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Bottom notice for Teachers -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center space-y-2">
        <p class="text-xs text-slate-500">
          Hisobingiz bormi? 
          <a href="/login.html" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline">Kirish sahifasi</a>
        </p>
        <p class="text-[11px] text-slate-400 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          👨‍🏫 <strong>O'qituvchilar diqqatiga:</strong> Ustozlar ro'yxatdan o'tishi talab qilinmaydi. Tizimga berilgan login va parol orqali <a href="/login.html" class="text-indigo-600 font-bold hover:underline">Kirish bo'limidan</a> kiring.
        </p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();

    const submitBtn = document.getElementById("submit-btn");
    const errorBox = document.getElementById("error-box");
    const errorMessage = document.getElementById("error-message");

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const login = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const classGrade = document.getElementById("classGrade").value;
      const phone = document.getElementById("phone").value.trim();

      if (!fullName || !email || !login || !password || !classGrade || !phone) {
        errorBox.classList.remove("hidden");
        errorMessage.textContent = "Iltimos, barcha maydonlarni to'liq to'ldiring";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-70");

      const payload = {
        role: "student",
        fullName,
        email,
        login,
        password,
        classGrade,
        phone
      };

      try {
        const user = await Auth.register(payload);
        window.location.replace("/student/");
      } catch (err) {
        errorBox.classList.remove("hidden");
        errorMessage.textContent = err.message || "Ro'yxatdan o'tishda xatolik yuz berdi";
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-70");
      }
    });
  </script>
</body>
</html>
